<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat &amp; Announcements | AMCAG</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/css/material-you.css">
  <link rel="stylesheet" href="/css/main.css?v=20260525-member1">
  <link rel="stylesheet" href="/css/mobile.css?v=20260525-member1">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: var(--color-primary-50);
      --primary-dark: var(--color-primary-40);
      --primary-container: var(--color-primary-95);
      --on-primary-container: var(--color-primary-20);
      --surface: var(--surface-card);
      --surface-variant: var(--color-neutral-98);
      --border-color: var(--color-neutral-90);
    }

    .chat-container {
      display: grid;
      grid-template-columns: minmax(240px, 300px) minmax(0, 1fr);
      gap: var(--space-4);
      min-height: 680px;
      height: calc(100vh - 190px);
      max-height: 900px;
      min-width: 0;
    }

    .chat-sidebar {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      overflow-y: auto;
      border: 1px solid var(--border-color);
    }
    .chat-sidebar h3 { margin: 0 0 var(--space-3); font-size: var(--text-lg); }
    .side-head { display: flex; align-items: center; justify-content: space-between; margin: var(--space-4) 0 var(--space-2); font-weight: 600; font-size: var(--text-sm); color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; }
    .side-btn { border: none; background: var(--primary-container); color: var(--on-primary-container); border-radius: var(--radius-full); width: 28px; height: 28px; cursor: pointer; font-size: 1rem; font-weight: 700; }
    .region-picker label { display: block; font-size: var(--text-xs); font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
    .region-picker select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-family: inherit; font-size: var(--text-base); background: #fff; margin-bottom: var(--space-3); }

    .chat-tab {
      padding: var(--space-3);
      border-radius: var(--radius-md);
      cursor: pointer;
      margin-bottom: var(--space-2);
      transition: background .2s ease;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      background: var(--surface-variant);
      position: relative;
      min-width: 0;
    }
    .chat-tab:hover { background: var(--primary-container); color: var(--on-primary-container); }
    .chat-tab.active { background: var(--primary); color: white; font-weight: 600; }
    .chat-tab-icon { font-size: 1.35rem; flex-shrink: 0; }
    .chat-tab-body { min-width: 0; flex: 1; }
    .chat-tab-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-tab-sub { font-size: var(--text-xs); color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-tab.active .chat-tab-sub { color: rgba(255,255,255,.85); }
    .unread-badge { background: #d93025; color: #fff; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .muted-mark { font-size: .8rem; opacity: .7; }

    .chat-main {
      background: var(--surface);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border-color);
      min-width: 0;
      min-height: 0;
    }

    .chat-header {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border-color);
      background: var(--primary-container);
      display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
    }
    .chat-header-text { flex: 1; min-width: 180px; }
    .chat-header h2 { margin: 0; font-size: var(--text-xl); color: var(--on-primary-container); }
    .chat-header p { margin: .25rem 0 0; font-size: var(--text-sm); color: var(--text-secondary); }
    .hdr-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .hdr-btn { border: 1px solid var(--border-color); background: #fff; border-radius: var(--radius-full); padding: 6px 12px; font-size: var(--text-sm); cursor: pointer; font-family: inherit; }
    .hdr-btn:hover { background: var(--surface-variant); }

    .notice-bar { padding: 8px var(--space-4); font-size: var(--text-xs); color: var(--text-secondary); background: #fff8e1; border-bottom: 1px solid #f3e3a6; }
    .notice-bar.info { background: #e8f0fe; border-color: #c6d6f7; }
    .notice-bar:empty { display: none; }
    .pinned-bar { border-bottom: 1px solid var(--border-color); background: #fff; max-height: 120px; overflow-y: auto; }
    .pinned-bar:empty { display: none; }
    .pinned-item { padding: 8px var(--space-4); font-size: var(--text-sm); cursor: pointer; border-bottom: 1px solid var(--surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pinned-item:hover { background: var(--surface-variant); }

    .chat-messages { flex: 1; overflow-y: auto; padding: var(--space-4); background: var(--surface-variant); min-height: 0; }
    #msg-list { display: flex; flex-direction: column; gap: var(--space-3); }
    .load-more { display: block; margin: 0 auto var(--space-3); }
    .day-sep { align-self: center; font-size: var(--text-xs); color: var(--text-secondary); background: #e9edf1; padding: 3px 12px; border-radius: var(--radius-full); }
    .system-note { align-self: center; font-size: var(--text-sm); color: var(--text-secondary); background: #fff; padding: 6px 14px; border-radius: var(--radius-full); text-align: center; max-width: 90%; }

    .message { display: flex; gap: var(--space-3); max-width: 82%; min-width: 0; position: relative; }
    .message.own-message { align-self: flex-end; flex-direction: row-reverse; }
    .message.own-message .message-header { justify-content: flex-end; }
    .message.own-message .message-text { background: var(--primary); color: white; }
    .message.own-message .reply-quote { background: rgba(255,255,255,.18); border-left-color: #fff; color: #fff; }
    .message-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; overflow: hidden; }
    .message-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .message-content { min-width: 0; flex: 0 1 auto; }
    .message-header { display: flex; align-items: center; gap: var(--space-2); margin-bottom: 4px; flex-wrap: wrap; }
    .message-sender { font-weight: 600; color: var(--text-primary); }
    .message-time { font-size: var(--text-xs); color: var(--text-secondary); }
    .message-role { font-size: var(--text-xs); padding: 2px 8px; border-radius: var(--radius-full); background: var(--primary-container); color: var(--on-primary-container); }
    .message-text { background: #fff; padding: var(--space-3); border-radius: var(--radius-md); color: var(--text-primary); overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.5; }
    .message-text a { color: inherit; text-decoration: underline; }
    .message-removed { background: #f1f3f4; color: var(--text-secondary); font-style: italic; padding: var(--space-3); border-radius: var(--radius-md); }
    .reply-quote { border-left: 3px solid var(--primary); background: var(--primary-container); border-radius: 6px; padding: 6px 10px; margin-bottom: 6px; font-size: var(--text-sm); color: var(--text-secondary); cursor: pointer; overflow: hidden; }
    .reply-quote b { display: block; color: var(--on-primary-container); font-size: var(--text-xs); }
    .message-attachment { margin-top: var(--space-2); }
    .message-attachment img { max-width: min(300px, 100%); max-height: 300px; border-radius: var(--radius-md); cursor: pointer; display: block; }
    .message-attachment audio { max-width: 100%; width: 260px; }
    .file-chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: var(--radius-md); background: #fff; color: var(--text-primary); text-decoration: none; border: 1px solid var(--border-color); overflow-wrap: anywhere; }
    .message-read-receipt { font-size: var(--text-xs); color: var(--text-secondary); margin-top: 4px; }
    .message.own-message .message-read-receipt { text-align: right; }
    .edited-tag { font-size: var(--text-xs); color: var(--text-secondary); font-style: italic; }
    .reactions { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
    .message.own-message .reactions { justify-content: flex-end; }
    .react-chip { border: 1px solid var(--border-color); background: #fff; border-radius: 12px; padding: 1px 8px; font-size: .85rem; cursor: pointer; font-family: inherit; }
    .react-chip.mine { background: var(--primary-container); border-color: var(--primary); }
    .msg-menu-btn { position: absolute; top: 0; right: -4px; opacity: 0; border: none; background: #fff; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.2); font-size: 14px; line-height: 1; }
    .message.own-message .msg-menu-btn { right: auto; left: -4px; }
    .message:hover .msg-menu-btn, .announcement:hover .msg-menu-btn, .msg-menu-btn:focus { opacity: 1; }
    @media (hover: none) { .msg-menu-btn { opacity: .75; } }
    .message.flash > .message-content, .announcement.flash { animation: flashbg 1.4s ease; }
    @keyframes flashbg { 0%,60% { box-shadow: 0 0 0 3px #ffd54f; } 100% { box-shadow: 0 0 0 0 transparent; } }

    .announcement { background: #fff; border-radius: var(--radius-lg); padding: var(--space-4); border-left: 4px solid var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,.08); position: relative; }
    .announcement.pinned { border-left-color: #f9a825; }
    .announcement-header { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3); flex-wrap: wrap; }
    .announcement-avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; overflow: hidden; flex-shrink: 0; }
    .announcement-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .announcement-meta { flex: 1; min-width: 120px; }
    .announcement-author { font-weight: 600; color: var(--text-primary); }
    .announcement-date { font-size: var(--text-sm); color: var(--text-secondary); }
    .announcement-badge { background: var(--error-container); color: var(--on-error-container); padding: 4px 12px; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 600; }
    .announcement-content { color: var(--text-primary); line-height: 1.6; margin-bottom: var(--space-2); overflow-wrap: anywhere; white-space: pre-wrap; }
    .announcement-content a { color: var(--primary-dark); }
    .announcement .msg-menu-btn { top: 8px; right: 8px; }

    .chat-input-area { padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border-color); background: #fff; }
    .composer-note { color: var(--text-secondary); font-size: var(--text-sm); text-align: center; padding: var(--space-2); }
    .reply-bar { display: flex; align-items: center; gap: var(--space-2); background: var(--primary-container); border-left: 3px solid var(--primary); padding: 6px 10px; border-radius: 6px; margin-bottom: var(--space-2); font-size: var(--text-sm); }
    .reply-bar .rb-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .x-btn { border: none; background: none; cursor: pointer; font-size: 1rem; padding: 2px 6px; }
    .chat-input-wrapper { display: flex; gap: var(--space-2); align-items: flex-end; min-width: 0; }
    .chat-input { flex: 1; min-height: 48px; max-height: 150px; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--radius-lg); resize: none; font-family: inherit; font-size: var(--text-base); min-width: 0; }
    .chat-input:focus { outline: none; border-color: var(--primary); }
    .chat-actions { display: flex; gap: var(--space-2); }
    .chat-action-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--surface-variant); color: var(--text-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; flex-shrink: 0; }
    .chat-action-btn:hover { background: var(--primary-container); }
    .chat-action-btn.recording { background: #d93025; color: #fff; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: .6; } }
    .chat-send-btn { background: var(--primary); color: white; }
    .chat-send-btn:hover { background: var(--primary-dark); }
    .chat-send-btn:disabled { opacity: .5; cursor: not-allowed; }
    .pending-file { display: flex; align-items: center; gap: var(--space-2); padding: 8px; background: var(--surface-variant); border-radius: var(--radius-md); margin-bottom: var(--space-2); font-size: var(--text-sm); }
    .pending-file img { height: 44px; border-radius: 6px; }
    .pending-file audio { height: 34px; max-width: 220px; }
    .pending-file .pf-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 240px; color: var(--text-secondary); text-align: center; padding: var(--space-6); }
    .empty-icon { font-size: 3.5rem; margin-bottom: var(--space-3); opacity: .5; }

    .msg-popup { position: fixed; z-index: 3000; background: #fff; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.25); padding: 6px; min-width: 190px; max-width: 280px; }
    .msg-popup .emoji-row { display: flex; gap: 2px; padding: 4px; border-bottom: 1px solid var(--border-color); margin-bottom: 4px; }
    .msg-popup .emoji-row button { border: none; background: none; font-size: 1.35rem; cursor: pointer; padding: 4px 6px; border-radius: 8px; }
    .msg-popup .emoji-row button:hover { background: var(--surface-variant); }
    .msg-popup .pop-item { display: block; width: 100%; text-align: left; border: none; background: none; padding: 9px 12px; cursor: pointer; border-radius: 8px; font-family: inherit; font-size: var(--text-base); }
    .msg-popup .pop-item:hover { background: var(--surface-variant); }
    .msg-popup .pop-item.danger { color: #c5221f; }

    .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 4000; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-card { background: #fff; border-radius: 16px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
    .modal-card h3 { margin: 0 0 12px; }
    .modal-card label { display: block; font-size: var(--text-sm); font-weight: 600; margin: 12px 0 4px; }
    .modal-card input[type=text], .modal-card textarea, .modal-card select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; font-size: var(--text-base); box-sizing: border-box; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
    .picker-list { max-height: 220px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 8px; margin-top: 6px; }
    .picker-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--surface-variant); font-size: var(--text-sm); }
    .picker-row small { color: var(--text-secondary); }
    .mod-card { background: #fff; border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .mod-card .snap { background: var(--surface-variant); border-radius: 8px; padding: 8px 10px; margin: 8px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .mod-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .mod-tab { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border-color); background: #fff; cursor: pointer; font-family: inherit; }
    .mod-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .audit-row { padding: 8px 0; border-bottom: 1px solid var(--surface-variant); font-size: var(--text-sm); }

    @media (max-width: 768px) {
      .chat-container { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: calc(100vh - 110px); min-height: 560px; gap: var(--space-2); }
      .chat-sidebar { min-width: 0; max-width: 100%; }
      .chat-input-wrapper { gap: 6px; }
      .chat-action-btn { width: 40px; height: 40px; }
      .chat-input-area { padding: var(--space-2); }
      .chat-sidebar { padding: var(--space-2); display: flex; flex-wrap: nowrap; gap: var(--space-2); overflow-x: auto; overflow-y: hidden; align-items: stretch; }
      .chat-sidebar .region-picker { flex: 0 0 170px; }
      .chat-sidebar .region-picker select { margin-bottom: 0; }
      .chat-sidebar .region-picker label { display: none; }
      #exec-tools { display: contents; }
      .chat-tab { flex-shrink: 0; }
      .chat-sidebar h3, .side-head > span { display: none; }
      .strip { display: contents; }
      .strip .chat-tab, #exec-tools .chat-tab { min-width: 150px; margin-bottom: 0; }
      .side-head { display: none; }
      .message { max-width: 94%; }
      .msg-menu-btn { opacity: .75; }
    }
    @media (min-width: 769px) { .strip { display: block; } }
  </style>
</head>
<body>
  <!-- ===== NAVBAR START ===== -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="/index.html" class="navbar-logo">
        <img src="/images/logo.jpg" alt="AMCAG Logo">
        <span>AMCAG</span>
      </a>

      <ul class="navbar-menu" style="margin-left: auto;">
        <li><a href="/member-dashboard.html" class="navbar-link">Dashboard</a></li>
        <li><a href="/profile.html" class="navbar-link">Profile</a></li>
        <li><a href="/membership.html" onclick="signOut(); return false;" class="navbar-link" data-nav-logout="true">Logout</a></li>
      </ul>
    </div>
  </nav>
  <!-- ===== NAVBAR END ===== -->

  <!-- ===== HEADER START ===== -->
  <section class="section-sm bg-surface">
    <div class="container">
      <h1 style="font-family: var(--font-display); font-size: var(--text-4xl); font-weight: var(--font-bold); margin-bottom: var(--space-1);">
        Chat &amp; Announcements
      </h1>
      <p style="color: var(--text-secondary); font-size: var(--text-lg);">
        Regional conversations, official updates, rooms and executive discussions
      </p>
    </div>
  </section>
  <!-- ===== HEADER END ===== -->

  <!-- ===== CHAT CONTAINER START ===== -->
  <section class="section">
    <div class="container">
      <div class="chat-container">
        <aside class="chat-sidebar">
          <div class="region-picker" id="region-picker" style="display:none;">
            <label for="region-select">Viewing region</label>
            <select id="region-select"></select>
          </div>
          <h3>Channels</h3>
          <div class="strip" id="channel-list"></div>
          <div class="side-head"><span>Rooms</span><button class="side-btn" id="new-room-btn" title="Create a room" style="display:none;">+</button></div>
          <div class="strip" id="room-list"></div>
          <div id="exec-tools" style="display:none;">
            <div class="side-head"><span>Executive tools</span></div>
            <div class="strip">
              <div class="chat-tab" id="tool-moderation"><span class="chat-tab-icon">🛡️</span><div class="chat-tab-body"><div class="chat-tab-name">Moderation</div><div class="chat-tab-sub">Reports &amp; log</div></div><span class="unread-badge" id="report-badge" style="display:none;"></span></div>
              <div class="chat-tab" id="tool-invite"><span class="chat-tab-icon">📨</span><div class="chat-tab-body"><div class="chat-tab-name">Invite members</div><div class="chat-tab-sub">Move from WhatsApp</div></div></div>
            </div>
          </div>
        </aside>

        <main class="chat-main" id="chat-main">
          <div class="chat-header" id="chat-header"></div>
          <div class="notice-bar" id="notice-bar"></div>
          <div class="pinned-bar" id="pinned-bar"></div>
          <div class="chat-messages" id="chat-messages">
            <button class="hdr-btn load-more" id="load-more" style="display:none;">Load earlier messages</button>
            <div id="msg-list"></div>
            <div class="empty-state" id="empty-state" style="display:none;"></div>
          </div>
          <div class="chat-input-area" id="composer"></div>
          <div class="chat-messages" id="moderation-view" style="display:none;"></div>
        </main>
      </div>
    </div>
  </section>
  <!-- ===== CHAT CONTAINER END ===== -->

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>

  <!-- App Scripts -->
  <script src="/js/firebase.js"></script>
  <script src="/js/auth.js?v=20260530-memberportal1"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/dialogs.js"></script>
  <script src="/js/layout-fix.js"></script>
  <script src="/js/notification-bell.js"></script>

  <script src="/js/chat-page.js?v=20261116-1"></script>
  <script src="/js/mobile-menu.js?v=20260525-member1"></script>
  <script>function signOut() { AuthModule.signOut(); }</script>
</body>
