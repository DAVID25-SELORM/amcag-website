<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign Management | National Dashboard</title>
  <link rel="stylesheet" href="/css/material-you.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/mobile.css?v=20260524-dropdown5">
</head>
<body class="dashboard-layout">
  <nav class="navbar">
    <div class="navbar-container">
      <a href="/national/dashboard.html" class="navbar-logo">
        <img src="/images/logo.jpg" alt="AMCAG Logo">
        <span>AMCAG National Dashboard</span>
      </a>
      <div class="navbar-actions">
        <button class="btn btn-sm" onclick="signOut()">Sign Out</button>
      </div>
    </div>
  </nav>

  <div class="dashboard-container">
    <aside class="dashboard-sidebar">
      <nav class="dashboard-nav">
        <a href="/national/dashboard.html" class="dashboard-nav-item">
          <span>📊</span> Dashboard
        </a>
        <a href="/national/members.html" class="dashboard-nav-item">
          <span>👥</span> Members
        </a>
        <a href="/national/analytics.html" class="dashboard-nav-item">
          <span>📈</span> Analytics
        </a>
        <a href="/national/donations-overview.html" class="dashboard-nav-item">
          <span>💰</span> Donations
        </a>
        <a href="/national/campaigns.html" class="dashboard-nav-item active">
          <span>🎯</span> Campaigns
        </a>
      </nav>
    </aside>

    <main class="dashboard-content">
      <div class="dashboard-header mb-6">
        <div>
          <h1 class="dashboard-title">Campaign Management</h1>
          <p class="dashboard-subtitle">Create and manage donation campaigns</p>
        </div>
        <div>
          <button class="btn btn-primary" onclick="openCampaignModal()">➕ New Campaign</button>
        </div>
      </div>

      <!-- Awaiting approval -->
      <div class="card mb-6" id="pendingCard" style="display: none; border-left: 4px solid #d4a017;">
        <h3 class="card-title mb-4">⏳ Awaiting Approval</h3>
        <div id="pendingCampaigns"></div>
      </div>

      <!-- Active Campaigns -->
      <div class="card mb-6">
        <h3 class="card-title mb-4">🎯 Active Campaigns</h3>
        <div id="activeCampaigns">
          <div style="text-align: center; padding: 3rem; color: var(--text-secondary);">
            Loading campaigns...
          </div>
        </div>
      </div>

      <!-- Completed/Cancelled Campaigns -->
      <div class="card">
        <h3 class="card-title mb-4">📋 Past Campaigns</h3>
        <div style="margin-bottom: 1.5rem;">
          <select id="statusFilter" class="form-input" style="width: auto;">
            <option value="">All Status</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
            <option value="rejected">Not approved</option>
          </select>
        </div>
        <div id="pastCampaigns">
          <div style="text-align: center; padding: 3rem; color: var(--text-secondary);">
            Loading past campaigns...
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Campaign Modal -->
  <div id="campaignModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; overflow-y: auto; padding: 2rem;">
    <div class="card" style="max-width: 700px; width: 90%;">
      <div style="padding: 2rem;">
        <h3 style="margin-bottom: 1.5rem;" id="modalTitle">Create New Campaign</h3>
        
        <form onsubmit="submitCampaign(event)">
          <input type="hidden" id="campaignId">
          
          <div class="form-group">
            <label for="campaignTitle" class="form-label required">Campaign Title</label>
            <input type="text" id="campaignTitle" class="form-input" required placeholder="e.g., Christmas Orphanage Outreach 2026">
          </div>

          <div class="form-group">
            <label for="campaignDescription" class="form-label required">Description</label>
            <textarea id="campaignDescription" class="form-input" rows="4" required placeholder="Describe the purpose and goals of this campaign..."></textarea>
          </div>

          <div class="grid grid-2 gap-4">
            <div class="form-group">
              <label for="campaignGoal" class="form-label">Target Amount (GHS)</label>
              <input type="number" id="campaignGoal" class="form-input" min="0" step="0.01" placeholder="Optional target amount">
            </div>

            <div class="form-group">
              <label for="campaignEndDate" class="form-label">End Date</label>
              <input type="date" id="campaignEndDate" class="form-input">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Campaign Image</label>
            <div id="imgPreview" style="display:none; margin-bottom: .75rem;"><img id="imgPreviewTag" alt="Campaign image preview" style="max-width: 100%; max-height: 180px; border-radius: 10px; object-fit: cover;"></div>
            <input type="file" id="campaignImageFile" accept="image/*" style="display:none">
            <div style="display:flex; gap:.5rem; flex-wrap:wrap; align-items:center;">
              <button type="button" class="btn btn-outline btn-sm" id="chooseImageBtn">📁 Choose image from computer</button>
              <button type="button" class="btn btn-outline btn-sm" id="removeImageBtn" style="display:none">Remove</button>
              <small style="color: var(--text-secondary);">JPG or PNG, up to 5 MB</small>
            </div>
            <input type="url" id="campaignImage" class="form-input" style="margin-top:.75rem" placeholder="…or paste an image link (https://…)">
          </div>

          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="campaignFeatured">
              <span>Feature this campaign on donation page</span>
            </label>
          </div>

          <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
            <button type="button" class="btn btn-outline" onclick="closeCampaignModal()">Cancel</button>
            <button type="submit" class="btn btn-primary" id="submitBtn">Create Campaign</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="/js/firebase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/dialogs.js"></script>
  <script src="/js/layout-fix.js"></script>
  <script src="/js/notification-bell.js"></script>
  <script src="/js/navbar-avatar.js"></script>

  <script>
    let allCampaigns = [];
    let currentUser = null;
    let editingCampaign = null;
    let myAccess = { approver: false, region: null };
    let pendingImageFile = null;

    // Older campaigns used goal/raised/donationCount; newer ones use targetAmount/currentAmount/donorCount.
    const goalOf = (c) => Number(c.targetAmount ?? c.goal ?? 0) || 0;
    const raisedOf = (c) => Number(c.currentAmount ?? c.raised ?? 0) || 0;
    const countOf = (c) => Number(c.donorCount ?? c.donationCount ?? 0) || 0;
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const callFn = (name, data) => firebase.functions().httpsCallable(name)(data).then((r) => r.data);
    const normRegionKey = (r) => String(r || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

    function signOut() {
      AuthModule.signOut();
    }

    async function loadCampaigns() {
      try {
        UIModule.showLoader('Loading campaigns...');
        
        const db = firebase.firestore();
        const snapshot = await db.collection('donation_campaigns').get();

        allCampaigns = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        })).sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
        // Regional executives only work with their own region's campaigns.
        if (myAccess.region) {
          allCampaigns = allCampaigns.filter((c) => normRegionKey(c.region) === normRegionKey(myAccess.region));
        }

        renderPendingCampaigns();
        renderActiveCampaigns();
        renderPastCampaigns();

        UIModule.hideLoader();
      } catch (error) {
        UIModule.hideLoader();
        console.error('Error loading campaigns:', error);
        UIModule.showAlert('Error loading campaigns: ' + error.message, 'error');
      }
    }

    function renderActiveCampaigns() {
      const active = allCampaigns.filter(c => c.status === 'active');
      const container = document.getElementById('activeCampaigns');

      if (active.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 3rem;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🎯</div>
            <h3 style="margin-bottom: 0.5rem;">No Active Campaigns</h3>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">Create your first campaign to start collecting targeted donations</p>
            <button class="btn btn-primary" onclick="openCampaignModal()">➕ Create Campaign</button>
          </div>
        `;
        return;
      }

      container.innerHTML = active.map(campaign => {
        const progress = goalOf(campaign) ? (raisedOf(campaign) / goalOf(campaign)) * 100 : 0;
        const hasEndDate = campaign.endDate;
        const daysLeft = hasEndDate ? Math.ceil((campaign.endDate.toDate() - new Date()) / (1000 * 60 * 60 * 24)) : null;
        
        return `
          <div class="card mb-4" style="border-left: 4px solid var(--color-primary);">
            <div style="display: flex; gap: 2rem; align-items: start;">
              ${campaign.imageUrl ? `
                <img src="${esc(campaign.imageUrl)}" alt="${esc(campaign.title)}" style="width: 150px; height: 150px; object-fit: cover; border-radius: var(--radius-md);">
              ` : ''}
              
              <div style="flex: 1;">
                <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem;">
                  <div>
                    <h3 style="margin: 0 0 0.5rem 0;">${esc(campaign.title)}</h3>
                    ${campaign.region ? '<div style="font-size:.8rem;color:var(--text-secondary);margin-bottom:.25rem;">Region: ' + esc(campaign.region) + '</div>' : ''}
                    <p style="color: var(--text-secondary); margin: 0;">${esc(campaign.description)}</p>
                  </div>
                  ${campaign.featured ? '<span class="badge badge-primary">⭐ Featured</span>' : ''}
                </div>

                ${goalOf(campaign) ? `
                  <div style="margin-bottom: 1rem;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                      <span style="font-weight: 600;">GHS ${raisedOf(campaign).toLocaleString()} raised</span>
                      <span style="color: var(--text-secondary);">Goal: GHS ${goalOf(campaign).toLocaleString()}</span>
                    </div>
                    <div class="progress-bar" style="height: 10px;">
                      <div style="width: ${Math.min(progress, 100)}%; height: 100%; background: var(--color-primary); border-radius: inherit;"></div>
                    </div>
                    <div style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">
                      ${progress.toFixed(1)}% complete
                    </div>
                  </div>
                ` : `
                  <div style="margin-bottom: 1rem;">
                    <div style="font-size: 1.25rem; font-weight: 600; color: var(--color-primary);">
                      GHS ${raisedOf(campaign).toLocaleString()} raised
                    </div>
                    <div style="font-size: 0.875rem; color: var(--text-secondary);">
                      ${countOf(campaign)} donation(s)
                    </div>
                  </div>
                `}

                <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                  ${daysLeft !== null ? `
                    <span class="badge badge-${daysLeft > 7 ? 'info' : 'warning'}">
                      ${daysLeft > 0 ? `${daysLeft} days left` : 'Ended'}
                    </span>
                  ` : ''}
                  <span style="font-size: 0.875rem; color: var(--text-secondary);">
                    ${countOf(campaign)} donations
                  </span>
                  
                  <div style="margin-left: auto; display: flex; gap: 0.5rem;">
                    <button class="btn btn-sm btn-outline" onclick="editCampaignById('${campaign.id}')">Edit</button>
                    <button class="btn btn-sm btn-success" onclick="completeCampaign('${campaign.id}')">✅ Complete</button>
                    <button class="btn btn-sm btn-danger" onclick="cancelCampaign('${campaign.id}')">❌ Cancel</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderPastCampaigns() {
      const statusFilter = document.getElementById('statusFilter').value;
      let past = allCampaigns.filter(c => ['completed', 'cancelled', 'rejected'].includes(c.status));
      
      if (statusFilter) {
        past = past.filter(c => c.status === statusFilter);
      }

      const container = document.getElementById('pastCampaigns');

      if (past.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 2rem; color: var(--text-secondary);">
            No past campaigns
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div style="overflow-x: auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Campaign</th>
                <th>Status</th>
                <th>Raised</th>
                <th>Goal</th>
                <th>Donations</th>
                <th>Created</th>
                <th>Ended</th>
              </tr>
            </thead>
            <tbody>
              ${past.map(c => `
                <tr>
                  <td>
                    <strong>${esc(c.title)}</strong>
                    ${c.featured ? '<span class="badge badge-primary ml-2">⭐</span>' : ''}
                  </td>
                  <td>
                    <span class="badge badge-${c.status === 'completed' ? 'success' : 'secondary'}">
                      ${c.status}
                    </span>
                  </td>
                  <td style="font-weight: 600;">GHS ${raisedOf(c).toLocaleString()}</td>
                  <td>${goalOf(c) ? `GHS ${goalOf(c).toLocaleString()}` : '-'}</td>
                  <td>${countOf(c)}</td>
                  <td>${c.createdAt && c.createdAt.toDate ? new Date(c.createdAt.toDate()).toLocaleDateString() : '-'}</td>
                  <td>${c.endedAt ? new Date(c.endedAt.toDate()).toLocaleDateString() : '-'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    window.openCampaignModal = () => {
      editingCampaign = null;
      document.getElementById('modalTitle').textContent = 'Create New Campaign';
      document.getElementById('submitBtn').textContent = 'Create Campaign';
      document.getElementById('campaignId').value = '';
      document.getElementById('campaignTitle').value = '';
      document.getElementById('campaignDescription').value = '';
      document.getElementById('campaignGoal').value = '';
      document.getElementById('campaignEndDate').value = '';
      document.getElementById('campaignImage').value = '';
      setImagePreview('');
      document.getElementById('campaignFeatured').checked = false;
      document.getElementById('campaignModal').style.display = 'flex';
    };

    window.editCampaignById = (id) => {
      const c = allCampaigns.find((x) => x.id === id);
      if (c) window.editCampaign(c);
    };

    function setImagePreview(url) {
      pendingImageFile = null;
      document.getElementById('campaignImageFile').value = '';
      const box = document.getElementById('imgPreview');
      if (url) { document.getElementById('imgPreviewTag').src = url; box.style.display = 'block'; }
      else { box.style.display = 'none'; }
      document.getElementById('removeImageBtn').style.display = url ? 'inline-flex' : 'none';
    }

    document.getElementById('chooseImageBtn').addEventListener('click', () => document.getElementById('campaignImageFile').click());
    document.getElementById('removeImageBtn').addEventListener('click', () => { document.getElementById('campaignImage').value = ''; setImagePreview(''); });
    document.getElementById('campaignImageFile').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (!/^image\//.test(file.type)) { UIModule.showAlert('Please choose an image file.', 'error'); e.target.value = ''; return; }
      if (file.size > 5 * 1024 * 1024) { UIModule.showAlert('That image is larger than 5 MB. Please choose a smaller one.', 'error'); e.target.value = ''; return; }
      pendingImageFile = file;
      document.getElementById('campaignImage').value = '';
      document.getElementById('imgPreviewTag').src = URL.createObjectURL(file);
      document.getElementById('imgPreview').style.display = 'block';
      document.getElementById('removeImageBtn').style.display = 'inline-flex';
    });
    document.getElementById('campaignImage').addEventListener('input', (e) => { if (e.target.value) { pendingImageFile = null; setImagePreview(''); document.getElementById('campaignImage').value = e.target.value; } });

    window.editCampaign = (campaign) => {
      editingCampaign = campaign;
      document.getElementById('modalTitle').textContent = 'Edit Campaign';
      document.getElementById('submitBtn').textContent = 'Save Changes';
      document.getElementById('campaignId').value = campaign.id;
      document.getElementById('campaignTitle').value = campaign.title;
      document.getElementById('campaignDescription').value = campaign.description;
      document.getElementById('campaignGoal').value = goalOf(campaign) || '';
      document.getElementById('campaignEndDate').value = campaign.endDate ? 
        campaign.endDate.toDate().toISOString().split('T')[0] : '';
      document.getElementById('campaignImage').value = '';
      setImagePreview(campaign.imageUrl || '');
      document.getElementById('campaignImage').value = campaign.imageUrl || '';
      document.getElementById('campaignFeatured').checked = campaign.featured || false;
      document.getElementById('campaignModal').style.display = 'flex';
    };

    window.closeCampaignModal = () => {
      document.getElementById('campaignModal').style.display = 'none';
      editingCampaign = null;
    };

    window.submitCampaign = async (e) => {
      e.preventDefault();
      try {
        UIModule.showLoader(editingCampaign ? 'Saving campaign...' : 'Creating campaign...');
        let imageUrl = document.getElementById('campaignImage').value.trim();
        if (pendingImageFile) {
          const safe = pendingImageFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
          const ref = firebase.storage().ref('campaign-images/' + currentUser.uid + '/' + Date.now() + '-' + safe);
          await ref.put(pendingImageFile, { contentType: pendingImageFile.type });
          imageUrl = await ref.getDownloadURL();
        }
        const result = await callFn('saveCampaign', {
          id: editingCampaign ? editingCampaign.id : null,
          title: document.getElementById('campaignTitle').value,
          description: document.getElementById('campaignDescription').value,
          targetAmount: document.getElementById('campaignGoal').value,
          endDate: document.getElementById('campaignEndDate').value,
          imageUrl,
          featured: document.getElementById('campaignFeatured').checked
        });
        UIModule.hideLoader();
        UIModule.showAlert(result.status === 'pending_approval'
          ? 'Campaign submitted. It will go live once the national president or PRO approves it.'
          : (editingCampaign ? 'Campaign updated successfully!' : 'Campaign created successfully!'), 'success');
        closeCampaignModal();
        loadCampaigns();
      } catch (error) {
        UIModule.hideLoader();
        console.error('Error saving campaign:', error);
        UIModule.showAlert('Error: ' + (error.message || 'Could not save the campaign'), 'error');
      }
    };

    function renderPendingCampaigns() {
      const pending = allCampaigns.filter((c) => c.status === 'pending_approval' || (c.status === 'rejected' && c.createdBy === currentUser.uid));
      const card = document.getElementById('pendingCard');
      if (!pending.length) { card.style.display = 'none'; return; }
      card.style.display = 'block';
      document.getElementById('pendingCampaigns').innerHTML = pending.map((c) => `
        <div style="padding: 1rem 0; border-bottom: 1px solid var(--color-neutral-90, #e5e5e5);">
          <div style="display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap;">
            <div style="min-width:0">
              <strong>${esc(c.title)}</strong>
              <span class="badge badge-${c.status === 'rejected' ? 'secondary' : 'warning'}" style="margin-left:.5rem">${c.status === 'rejected' ? 'Not approved' : 'Awaiting approval'}</span>
              <div style="font-size:.85rem; color: var(--text-secondary);">${esc(c.region || 'National')} · by ${esc(c.createdByName || '')}${c.reviewNote ? ' · ' + esc(c.reviewNote) : ''}</div>
              <p style="margin:.5rem 0 0; color: var(--text-secondary);">${esc(c.description)}</p>
            </div>
            <div style="display:flex; gap:.5rem; align-items:flex-start; flex-wrap:wrap;">
              ${c.status === 'pending_approval' && myAccess.approver ? `
                <button class="btn btn-sm btn-success" onclick="reviewCampaign('${c.id}', 'approve')">✅ Approve</button>
                <button class="btn btn-sm btn-danger" onclick="reviewCampaign('${c.id}', 'reject')">Reject</button>` : ''}
              <button class="btn btn-sm btn-outline" onclick="editCampaignById('${c.id}')">Edit</button>
            </div>
          </div>
        </div>`).join('');
    }

    window.reviewCampaign = async (id, decision) => {
      let reason = '';
      if (decision === 'reject') {
        reason = await AMCAGDialog.prompt('Reason for not approving (optional):');
        if (reason === null) return;
      }
      try {
        UIModule.showLoader('Saving...');
        await callFn('reviewCampaign', { id, decision, reason });
        UIModule.hideLoader();
        UIModule.showAlert(decision === 'approve' ? 'Campaign approved and published.' : 'Campaign not approved.', 'success');
        loadCampaigns();
      } catch (error) {
        UIModule.hideLoader();
        UIModule.showAlert('Error: ' + (error.message || 'Could not save'), 'error');
      }
    };

    async function closeCampaign(id, status, reason) {
      try {
        UIModule.showLoader('Saving...');
        await callFn('setCampaignStatus', { id, status, reason });
        UIModule.hideLoader();
        UIModule.showAlert(status === 'completed' ? 'Campaign completed' : 'Campaign cancelled', 'success');
        loadCampaigns();
      } catch (error) {
        UIModule.hideLoader();
        UIModule.showAlert('Error: ' + (error.message || 'Could not update the campaign'), 'error');
      }
    }

    window.completeCampaign = async (campaignId) => {
      if (!await AMCAGDialog.confirm('Mark this campaign as completed? This cannot be undone.')) return;
      closeCampaign(campaignId, 'completed');
    };

    window.cancelCampaign = async (campaignId) => {
      const reason = await AMCAGDialog.prompt('Enter reason for cancellation (optional):');
      if (reason === null) return;
      closeCampaign(campaignId, 'cancelled', reason);
    };

    document.getElementById('statusFilter').addEventListener('change', renderPastCampaigns);

    AuthModule.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = '/membership.html';
        return;
      }

      currentUser = user;
      
      const db = firebase.firestore();
      const userDoc = await db.collection('users').doc(user.uid).get();
      const userData = userDoc.data();
      
      const role = userData.role;
      const title = String(userData.executiveTitle || userData.title || '').toLowerCase();
      const selected = role === 'super_admin' ||
        (['national_executive', 'regional_executive'].includes(role) &&
         /(^|[^a-z])(president|secretary|pro|public relations( officer)?)([^a-z]|$)/.test(title) &&
         !/vice|assistant|deputy|organi[sz]er|treasurer/.test(title));
      if (!selected) {
        UIModule.showAlert('Access denied. Only selected executives can manage campaigns.', 'error');
        setTimeout(() => window.location.href = role === 'regional_executive' ? '/region-dashboard/index.html' : (role === 'member' ? '/member-dashboard.html' : '/national/dashboard.html'), 2000);
        return;
      }
      myAccess = {
        region: role === 'regional_executive' ? userData.region : null,
        approver: role === 'super_admin' || (role === 'national_executive' && /(^|[^a-z])(president|pro|public relations( officer)?)([^a-z]|$)/.test(title) && !/vice|assistant|deputy|organi[sz]er|treasurer|secretary/.test(title))
      };

      loadCampaigns();
    });
  </script>
  <script src="/js/mobile-menu.js?v=20260524-dropdown5"></script>
</body>
</html>
