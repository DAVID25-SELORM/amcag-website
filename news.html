  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>

  <script>
    const sampleNews = [];

    function getAgmNewsArticle() {
      return {
        id: 'agm-2026-news',
        title: 'AGM 2026 Registration Now Open',
        category: 'AGM 2026',
        excerpt: 'AMCAG members can now register for the 2026 Annual General Meeting scheduled for July 10-11, 2026 in Koforidua.',
        content: 'The AMCAG Annual General Meeting 2026 will bring members together for governance updates, welfare discussions, professional development, and national planning. Members are encouraged to register early.',
        image: '/images/WhatsApp Image 2026-03-04 at 1.34.32 PM.jpeg',
        createdAt: new Date('2026-05-30T09:00:00'),
        link: '/events.html#featured-agm'
      };
    }

    function renderNews(articles) {
      return articles.map(data => {
        const date = data.createdAt instanceof Date ? data.createdAt : new Date(data.createdAt);
        const formattedDate = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        
        const badgeClass = {
          'announcement': 'badge-primary',
          'partnership': 'badge-success',
          'achievement': 'badge-secondary',
          'event': 'badge-warning'
        }[data.category?.toLowerCase()] || 'badge-primary';
        
        return `
          <div class="card">
            <div style="height: 200px; background: var(--color-primary-95); border-radius: var(--radius-lg); margin-bottom: var(--space-3); background-image: url('${data.image || ''}'); background-size: cover; background-position: center;"></div>
            <span class="badge ${badgeClass} mb-2">${data.category || 'News'}</span>
            <h3 class="card-title mb-2">${data.title || 'Untitled'}</h3>
            <p class="card-body mb-3">${(data.excerpt || data.content || '').substring(0, 120)}...</p>
            <div style="color: var(--text-tertiary); font-size: var(--text-sm); margin-bottom: var(--space-3);">${formattedDate}</div>
            ${data.link ? `<a href="${data.link}" class="btn btn-outline btn-sm">Read More</a>` : `<a href="#" class="btn btn-outline btn-sm" onclick="viewFullArticle('${data.id}'); return false;">Read More</a>`}
          </div>
        `;
      }).join('');
    }
    
    function viewFullArticle(articleId) {
      const article = allArticles.find(a => a.id === articleId);
      if (!article) {
        alert('Article not found');
        return;
      }
      
      const date = article.createdAt instanceof Date ? article.createdAt : new Date(article.createdAt);
      const formattedDate = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      
      const badgeClass = {
        'announcement': 'badge-primary',
        'partnership': 'badge-success',
        'achievement': 'badge-secondary',
        'event': 'badge-warning'
      }[article.category?.toLowerCase()] || 'badge-primary';
      
      // Create modal for full article
      const modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML = `
        <div class="modal-content" style="max-width: 800px; max-height: 90vh; overflow-y: auto;">
          <div class="modal-header">
            <div>
              <span class="badge ${badgeClass}">${article.category || 'News'}</span>
              <h2 style="margin-top: 0.5rem;">${article.title || 'Untitled'}</h2>
              <div style="color: var(--text-tertiary); font-size: var(--text-sm); margin-top: 0.5rem;">${formattedDate}</div>
            </div>
            <button class="btn-close" onclick="this.closest('.modal').remove()">×</button>
          </div>
          <div class="modal-body">
            ${article.image ? `<img src="${article.image}" alt="${article.title}" style="width: 100%; height: auto; border-radius: var(--radius-lg); margin-bottom: var(--space-4);">` : ''}
            <div style="font-size: var(--text-lg); line-height: 1.8; color: var(--text-primary);">
              ${article.content || article.excerpt || 'No content available.'}
            </div>
            ${article.author ? `<div style="margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--color-neutral-90); color: var(--text-secondary);">By ${article.author}</div>` : ''}
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      
      // Close modal when clicking outside
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.remove();
        }
      });
    }
    
    // Store all articles globally for viewFullArticle function
    let allArticles = [];

    async function loadNews() {
      const newsContainer = document.getElementById('news-list');
      
      try {
        const db = firebase.firestore();
        let snapshot;
        
        try {
          snapshot = await db.collection('news')
            .where('published', '==', true)
            .orderBy('createdAt', 'desc')
            .limit(24)
            .get();
        } catch (queryError) {
          console.warn('News query failed, trying without orderBy:', queryError);
          snapshot = await db.collection('news')
            .where('published', '==', true)
            .limit(24)
            .get();
        }
        
        if (snapshot.empty) {
          allArticles = [getAgmNewsArticle()];
          newsContainer.innerHTML = renderNews(allArticles);
          return;
        }
        
        const articles = snapshot.docs.map(doc => ({
          ...doc.data(),
          id: doc.id,
          createdAt: doc.data().createdAt?.toDate ? doc.data().createdAt.toDate() : new Date(doc.data().createdAt)
        }));
        
        const filteredArticles = articles.filter((article) =>
          article.id !== 'agm-2026-news' &&
          !String(article.title || '').toLowerCase().includes('agm 2026')
        );
        allArticles = [getAgmNewsArticle(), ...filteredArticles];
        newsContainer.innerHTML = renderNews(allArticles);
        
      } catch (error) {
        console.error('Error loading news:', error);
        allArticles = [getAgmNewsArticle()];
        newsContainer.innerHTML = renderNews(allArticles);
      }
    }
    
    // Wait for Firebase to be initialized
    function waitForFirebase() {
      if (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0) {
        loadNews();
      } else {
        setTimeout(waitForFirebase, 50);
      }
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', waitForFirebase);
    } else {
      waitForFirebase();
    }
  </script>
  <script src="/js/mobile-menu.js?v=20260524-dropdown5"></script>
  
  <!-- Theme Toggle -->
  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      
      const icon = document.querySelector('.theme-icon');
      icon.textContent = newTheme === 'dark' ? '☀️' : '🌙';
    }
    
    // Initialize theme
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      
      if (savedTheme === 'dark') {
        const icon = document.querySelector('.theme-icon');
        if (icon) icon.textContent = '☀️';
      }
    })();
  </script>
